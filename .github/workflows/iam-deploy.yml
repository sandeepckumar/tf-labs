name: Terraform IAM Deploy
on:
  push:
    branches:
      - test/iam
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Run Plan
        uses: ./.github/actions/tf-plan
        with:
          working_directory: ./terraform/iam
          role_to_assume: ${{ secrets.AWS_ROLE }}
          region: ${{ vars.REGION }}

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - name: Run Apply
        uses: ./.github/actions/tf-apply
        with:
          working_directory: ./terraform/iam
          role_to_assume: ${{ secrets.AWS_ROLE }}
          region: ${{ vars.REGION }}
